<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회2 - 셀프체크룸</title>
<style>
  :root { --main-color:#22d3ee; --bg-dark:#07090c; --accent:#a855f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg-dark); color:#fff; font-family:'Pretendard',-apple-system,sans-serif; min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  .topbar { position:sticky; top:0; z-index:40; background:rgba(7,9,12,0.92); backdrop-filter:blur(10px); border-bottom:1px solid #1a1e24; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .crumb { font-size:0.78em; color:#888; } .crumb b{ color:#ccc; font-weight:600; }
  .hub-link { font-size:0.72em; color:#aaa; padding:6px 12px; border:1px solid #2c313a; border-radius:8px; }
  .hub-link:hover { border-color:var(--accent); color:#fff; }
  .hero { padding:50px 20px 10px; text-align:center; max-width:700px; margin:0 auto; }
  .hero .eyebrow { font-size:0.74em; font-weight:800; letter-spacing:2px; color:var(--main-color); text-transform:uppercase; margin-bottom:10px; }
  .hero h1 { font-size:clamp(1.7em,4vw,2.2em); margin:0; }

  .unit-wrap { max-width:820px; margin:40px auto 60px; padding:0 20px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:640px) { .unit-wrap { grid-template-columns:1fr; } }
  .ucard { display:flex; gap:16px; align-items:flex-start; background:#0d0f14; border:1.5px solid #1a1e24; border-radius:18px; padding:20px; }
  .ucard.pending { opacity:0.45; }
  .ucard .u-roman { font-size:1.4em; font-weight:900; color:var(--accent); flex-shrink:0; width:44px; text-align:center; }
  .ucard .u-body { flex:1; min-width:0; }
  .ucard .u-title { font-size:1.02em; font-weight:800; color:#fff; margin-bottom:8px; }
  .ucard .u-links { display:flex; gap:6px; flex-wrap:wrap; }
  .ucard .u-links a { font-size:0.7em; font-weight:800; padding:6px 10px; border-radius:7px; }
  .ucard .u-links a.digital { color:#22d3ee; background:rgba(34,211,238,0.14); }
  .ucard .u-links a.paper { color:#fbbf24; background:rgba(251,191,36,0.14); }
  .ucard .u-badge { font-size:0.66em; font-weight:800; padding:3px 9px; border-radius:6px; color:#888; background:#161a20; }

  footer { text-align:center; padding:10px 20px 50px; color:#555; font-size:0.75em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="crumb"><b>🔍 셀프체크룸</b> / 사회2</div>
    <a class="hub-link" href="../index.html">← 셀프체크룸</a>
  </div>

  <section class="hero">
    <div class="eyebrow">사회2</div>
    <h1>단원을 골라 확인해 보자</h1>
  </section>

  <div class="unit-wrap" id="unitWrap"></div>

  <footer>EAIM 사회 수업 · 셀프체크룸</footer>

<script>
const UNITS = [
  { icon:'Ⅰ', title:'헌법과 국가기관', digital:'unit1-check.html', paper:'unit1-worksheet.html' },
  { icon:'Ⅱ', title:'경제생활과 선택', digital:'unit2-check.html', paper:'unit2-worksheet.html' },
  { icon:'Ⅲ', title:'시장과 가격', digital:'unit3-check.html', paper:'unit3-worksheet.html' },
  { icon:'Ⅳ', title:'우리나라 경제와 세계화', digital:'unit4-check.html', paper:'unit4-worksheet.html' },
  { icon:'Ⅴ', title:'국제사회와 한반도', digital:'unit5-check.html', paper:'unit5-worksheet.html' },
  { icon:'Ⅵ', title:'사회 변동과 사회문제', digital:'unit6-check.html', paper:'unit6-worksheet.html' },
  { icon:'Ⅶ', title:'대한민국, 우리가 살아가는 곳', digital:'unit7-check.html', paper:'unit7-worksheet.html' },
  { icon:'Ⅷ', title:'우리나라의 자연환경과 인간생활', digital:'unit8-check.html', paper:'unit8-worksheet.html' },
  { icon:'Ⅸ', title:'중부지역', digital:'unit9-check.html', paper:'unit9-worksheet.html' },
  { icon:'Ⅹ', title:'남부지역', digital:'unit10-check.html', paper:'unit10-worksheet.html' },
  { icon:'Ⅺ', title:'북부지역', digital:'unit11-check.html', paper:'unit11-worksheet.html' },
  { icon:'Ⅻ', title:'지속가능한 세계와 글로벌 시민', digital:'unit12-check.html', paper:'unit12-worksheet.html' },
];
function render(){
  document.getElementById('unitWrap').innerHTML = UNITS.map(u => {
    const ready = !!u.digital;
    const links = ready
      ? `<div class="u-links"><a class="digital" href="${u.digital}">📱 디지털</a><a class="paper" href="${u.paper}">🖨️ 인쇄용</a></div>`
      : `<span class="u-badge">준비중</span>`;
    return `<div class="ucard ${ready?'ready':'pending'}"><div class="u-roman">${u.icon}</div><div class="u-body"><div class="u-title">${u.title}</div>${links}</div></div>`;
  }).join('');
}
render();
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../shared/teacher-tracker.js"></script>
</body>
</html>
