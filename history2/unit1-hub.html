<style>
  :root { --main-color: #dc2626; --bg-dark: #0a0708; --accent: #d4a847; }

  a { color: inherit; text-decoration: none; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(10,7,8,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #262022; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .crumb { font-size: 0.78em; color: #888; } .crumb b { color: #ccc; font-weight: 600; }

  .hero { padding: 56px 20px 20px; text-align: center; max-width: 760px; margin: 0 auto; }

  .hero h1 { font-size: clamp(1.7em, 4.2vw, 2.4em); margin: 0 0 14px; background: linear-gradient(100deg, #fff 25%, #fcd34d 55%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.3; }

  .progress-top .p-count { font-size: 0.78em; color: #888; }
  .progress-bar-outer { height: 9px; border-radius: 5px; background: #262022; overflow: hidden; }

  .infographic-wrap { max-width: 900px; margin: 36px auto 0; padding: 0 20px; }

    display:grid;

  .topic-num{font-size:13px;font-weight:900;color:#f6b91a;margin-bottom:8px}
  .topic-visual-card img{
