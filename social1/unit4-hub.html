function renderGroup(id, items){
  document.getElementById(id).innerHTML = items.map(item => `
    <a class="lcard" href="${item.href}">
      <div class="l-icon"><img src="${item.img}" alt=""></div>
      <div class="l-body">
        <div class="l-title">${item.title}</div>
        <div class="l-desc">${item.desc}</div>
      </div>
      <div class="l-badge">완료</div>
    </a>
  `).join('');
}
renderGroup('group1', GROUP1);
document.getElementById('topicStrip').innerHTML = GROUP1.map((item,idx)=>`
  <a class="topic-tile" href="${item.href}">
    <img src="${item.img}" alt="${item.title}">
    <div class="topic-no">${String(idx+1).padStart(2,'0')}</div>
    <div class="topic-title">${item.title}</div>
  </a>
`).join('');
</script>
