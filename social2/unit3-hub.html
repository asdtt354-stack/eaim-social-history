<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ⅲ. 시장과 가격 - EAIM 사회 수업</title>
<style>
  :root { --main-color: #f59e0b; --bg-dark: #0a0708; --accent: #a855f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-dark); color: #fff; font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(10,7,8,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #262022; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .crumb { font-size: 0.78em; color: #888; } .crumb b { color: #ccc; font-weight: 600; }
  .hub-link { font-size: 0.72em; color: #aaa; padding: 6px 12px; border: 1px solid #3a3a3c; border-radius: 8px; }
  .hub-link:hover { border-color: var(--accent); color: #fff; }
  .hero { padding: 56px 20px 20px; text-align: center; max-width: 760px; margin: 0 auto; }
  .hero .eyebrow { font-size: 0.74em; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .hero h1 { font-size: clamp(1.7em, 4.2vw, 2.4em); margin: 0 0 14px; background: linear-gradient(100deg, #fff 25%, #fcd34d 55%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.3; }
  .hero p.lead { color: #aaa; font-size: 0.98em; line-height: 1.75; margin: 0 auto; max-width: 580px; }
  .progress-shell { max-width: 620px; margin: 30px auto 0; padding: 16px 22px; background: #121012; border: 1px solid #262022; border-radius: 16px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-top .p-label { font-size: 0.82em; color: #ccc; font-weight: 700; }
  .progress-top .p-count { font-size: 0.78em; color: #888; }
  .progress-bar-outer { height: 9px; border-radius: 5px; background: #262022; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: linear-gradient(90deg, #f59e0b, #a855f7); }
  .group-wrap { max-width: 900px; margin: 50px auto 0; padding: 0 20px; }
  .infographic-wrap { max-width: 900px; margin: 36px auto 0; padding: 0 20px; }
  .infographic-wrap svg { width: 100%; height: auto; display: block; }

  .lesson-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 640px) { .lesson-grid { grid-template-columns: 1fr; } }
  .lcard { display: flex; align-items: center; gap: 14px; background: #121012; border: 1.5px solid #262022; border-radius: 16px; padding: 16px 18px; transition: all .2s; }
  .lcard:hover { border-color: var(--main-color); transform: translateY(-2px); }
  .lcard .l-icon { font-size: 1.7em; flex-shrink: 0; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: #1a1a1c; border-radius: 12px; }
  .lcard .l-body { flex: 1; min-width: 0; }
  .lcard .l-title { font-size: 0.94em; font-weight: 800; color: #fff; margin-bottom: 3px; }
  .lcard .l-desc { font-size: 0.76em; color: #999; line-height: 1.5; }
  .lcard .l-badge { font-size: 0.66em; font-weight: 800; color: #34d399; background: rgba(52,211,153,0.14); padding: 3px 8px; border-radius: 6px; flex-shrink: 0; white-space: nowrap; }
  .checkroom-wrap { max-width: 700px; margin: 40px auto 60px; padding: 0 20px; }
  .checkroom-card { background: linear-gradient(135deg, rgba(34,211,238,0.10), rgba(168,85,247,0.10)); border: 1.5px solid rgba(34,211,238,0.28); border-radius: 22px; padding: 26px; text-align: center; }
  .checkroom-card h2 { margin: 0 0 8px; font-size: 1.1em; }
  .checkroom-card p { color: #ccc; font-size: 0.86em; line-height: 1.7; margin: 0 auto 16px; max-width: 480px; }
  .checkroom-card .go-btn { display: inline-block; background: #22d3ee; color: #04222b; font-weight: 800; padding: 10px 20px; border-radius: 10px; font-size: 0.84em; }
  footer { text-align: center; padding: 10px 20px 50px; color: #555; font-size: 0.75em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="crumb"><b>사회2</b><span class="sep">/</span><b>Ⅲ. 시장과 가격</b></div>
    <a class="hub-link" href="index.html">← 사회2 전체 단원</a>
  </div>

  <section class="hero">
    <div class="eyebrow">사회2 · Ⅲ단원</div>
    <h1>시장과 가격</h1>
    <p class="lead">시장과 가격 단원의 소단원들을 하나씩 학습해 보자.</p>
  </section>

  <div class="infographic-wrap">
    <svg viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="170" rx="20" fill="#121012" stroke="#262022"/><g transform="translate(150,85)"><rect x="-72" y="-58" width="144" height="116" rx="16" fill="#1a1a1c" stroke="#f59e0b" stroke-width="2"/><text x="0" y="-12" font-size="30" text-anchor="middle">🛒</text><text x="0" y="18" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">시장의 의미와 필요성</text><text x="0" y="38" font-size="11" fill="#f59e0b" text-anchor="middle">01</text></g><g transform="translate(450,85)"><rect x="-72" y="-58" width="144" height="116" rx="16" fill="#1a1a1c" stroke="#a855f7" stroke-width="2"/><text x="0" y="-12" font-size="30" text-anchor="middle">⚖️</text><text x="0" y="18" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">시장 가격의 결정</text><text x="0" y="38" font-size="11" fill="#a855f7" text-anchor="middle">02</text></g><g transform="translate(750,85)"><rect x="-72" y="-58" width="144" height="116" rx="16" fill="#1a1a1c" stroke="#f59e0b" stroke-width="2"/><text x="0" y="-12" font-size="30" text-anchor="middle">📉</text><text x="0" y="18" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">시장 가격의 변동</text><text x="0" y="38" font-size="11" fill="#f59e0b" text-anchor="middle">03</text></g></svg>
  </div>

  <div class="progress-shell">
    <div class="progress-top"><span class="p-label">단원 진행률</span><span class="p-count">3 / 3 완료</span></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:100%"></div></div>
  </div>

  <div class="group-wrap">
    <div class="lesson-grid" id="group1"></div>
  </div>

  <div class="checkroom-wrap">
    <div class="checkroom-card">
      <h2>🔍 배운 내용을 형성평가로 점검해 보자</h2>
      <p>Ⅲ단원 셀프체크룸에서 무작위로 출제되는 객관식·서술형 문제를 풀어보고, 헷갈리는 부분을 바로 확인할 수 있어요.</p>
      <a class="go-btn" href="../self-check-room/social1/unit3-check.html">Ⅲ단원 셀프체크룸 가기 →</a>
    </div>
  </div>

  <footer>EAIM 사회 수업 · 시장과 가격</footer>

<script>
const GROUP1 = [{"icon": "🛒", "title": "시장의 의미와 필요성", "desc": "시장의 예 · 시장으로 보기 어려운 것 분류 활동 + 확인 퀴즈", "href": "unit3/market-meaning.html"}, {"icon": "⚖️", "title": "시장 가격의 결정", "desc": "수요 법칙에 해당하는 것 · 공급 법칙에 해당하는 것 분류 활동 + 확인 퀴즈", "href": "unit3/price-formation.html"}, {"icon": "📉", "title": "시장 가격의 변동", "desc": "가격을 상승시키는 요인 · 가격을 하락시키는 요인 분류 활동 + 확인 퀴즈", "href": "unit3/price-change.html"}];
function renderGroup(id, items){
  document.getElementById(id).innerHTML = items.map(item => `
    <a class="lcard" href="${item.href}">
      <div class="l-icon">${item.icon}</div>
      <div class="l-body">
        <div class="l-title">${item.title}</div>
        <div class="l-desc">${item.desc}</div>
      </div>
      <div class="l-badge">완료</div>
    </a>
  `).join('');
}
renderGroup('group1', GROUP1);
</script>
</body>
</html>
